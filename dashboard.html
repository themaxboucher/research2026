<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Research Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --bg-subtle: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --accent: #2f81f7;
        --chip-add: rgba(46, 160, 67, 0.15);
        --chip-add-fg: #3fb950;
        --chip-modify: rgba(187, 128, 9, 0.15);
        --chip-modify-fg: #d29922;
        --chip-delete: rgba(248, 81, 73, 0.15);
        --chip-delete-fg: #f85149;
        --chip-rename: rgba(56, 139, 253, 0.15);
        --chip-rename-fg: #58a6ff;
        --chip-default: rgba(110, 118, 129, 0.2);
        --chip-default-fg: #8b949e;
        --comment-marker: #d29922;
        --border-muted: #21262d;
        --bg-sunken: #010409;
        --human: #3fb950;
        --model: #bc8cff;
        --chip-error: rgba(248, 81, 73, 0.15);
        --chip-error-fg: #f85149;
      }
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-thumb {
        background: #484f58;
        border: 3px solid var(--bg);
        border-radius: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      * {
        box-sizing: border-box;
      }
      /* Inline SVG icons scale with the surrounding font-size and inherit its
         color via stroke="currentColor". */
      .icon {
        width: 1em;
        height: 1em;
        display: inline-block;
        vertical-align: -0.125em;
        flex-shrink: 0;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        font-size: 13px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header.topbar {
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-subtle);
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-shrink: 0;
      }
      header.topbar h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
      }
      header.topbar .meta {
        font-size: 13px;
        color: var(--text-muted);
      }
      main {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      aside.sidebar {
        width: 380px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--bg-subtle);
        flex-shrink: 0;
      }
      .sidebar-controls {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sidebar-controls input[type="text"] {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        background: var(--bg);
        color: var(--text);
      }
      .sidebar-controls input[type="text"]::placeholder {
        color: var(--text-muted);
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .filter-row label {
        font-size: 12px;
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        background: var(--bg);
        user-select: none;
      }
      .filter-row input[type="checkbox"] {
        display: none;
      }
      .filter-row label.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .sidebar-count {
        font-size: 12px;
        color: var(--text-muted);
        padding: 0 4px;
      }
      ul.records {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        flex: 1;
      }
      ul.records li.record {
        padding: 12px 16px 12px 36px;
        border-bottom: 1px solid var(--border-muted);
        border-left: 3px solid transparent;
        cursor: pointer;
        font-size: 13px;
      }
      ul.records li.record:hover {
        background: #161b22;
      }
      ul.records li.record.selected {
        background: rgba(56, 139, 253, 0.15);
        border-left-color: var(--accent);
      }
      ul.records li.repo-header {
        position: sticky;
        top: 0;
        z-index: 3;
        padding: 12px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      ul.records li.repo-header .repo-name {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      ul.records li.repo-header a.repo-name {
        color: var(--text);
        text-decoration: none;
      }
      ul.records li.repo-header a.repo-name:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      ul.records li.repo-header .repo-count {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      ul.records li.commit-header {
        position: sticky;
        top: 45px;
        z-index: 2;
        padding: 8px 16px 8px 24px;
        background: var(--bg-subtle);
        border-bottom: 1px solid var(--border-muted);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      ul.records li.commit-header .commit-hash {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }
      ul.records li.commit-header .commit-count {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      ul.records .row1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      ul.records .filename {
        font-weight: 600;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      ul.records .nloc {
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .record-comments {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }
      .record-comment {
        padding: 6px 8px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-muted);
        border-radius: 6px;
        cursor: pointer;
      }
      .record-comment:hover {
        border-color: var(--border);
        background: #1c2128;
      }
      .record-comment .rc-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .status-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .status-pill.added {
        background: var(--chip-add);
        color: var(--chip-add-fg);
      }
      .status-pill.modified {
        background: var(--chip-modify);
        color: var(--chip-modify-fg);
      }
      .record-comment .rc-line {
        margin-left: auto;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      .record-comment .rc-text {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .chip {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        background: var(--chip-default);
        color: var(--chip-default-fg);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .chip.ADD {
        background: var(--chip-add);
        color: var(--chip-add-fg);
      }
      .chip.MODIFY {
        background: var(--chip-modify);
        color: var(--chip-modify-fg);
      }
      .chip.DELETE {
        background: var(--chip-delete);
        color: var(--chip-delete-fg);
      }
      .chip.RENAME {
        background: var(--chip-rename);
        color: var(--chip-rename-fg);
      }
      section.detail {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .detail-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
      }
      .detail-title {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        margin: 0 0 6px 0;
        word-break: break-all;
      }
      .detail-sub {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 16px;
        word-break: break-all;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
      }
      .badge {
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg-subtle);
      }
      .badge.add {
        color: var(--chip-add-fg);
      }
      .badge.del {
        color: var(--chip-delete-fg);
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 0 16px;
        background: var(--bg-subtle);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow-x: auto;
      }
      .tabs button {
        background: none;
        border: none;
        padding: 12px 14px;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-muted);
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tabs button:hover {
        color: var(--text);
      }
      .tabs button.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .tab-panel {
        flex: 1;
        overflow: auto;
        background: var(--bg);
      }
      .tab-panel.hidden {
        display: none;
      }
      .empty-state {
        padding: 64px 40px;
        color: var(--text-muted);
        font-size: 14px;
        text-align: center;
      }

      /* Code block with line numbers + comment gutter markers */
      .code-wrap {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.7;
        padding: 8px 0;
      }
      .code-wrap pre {
        margin: 0;
      }
      .code-line {
        display: grid;
        grid-template-columns: 48px 16px 1fr;
        align-items: start;
      }
      .code-line .lineno {
        text-align: right;
        padding-right: 12px;
        color: var(--text-muted);
        user-select: none;
        background: var(--bg-subtle);
        border-right: 1px solid var(--border-muted);
      }
      .code-line .marker {
        background: var(--bg-subtle);
        border-right: 1px solid var(--border-muted);
      }
      .code-line.has-comment .marker {
        background: var(--comment-marker);
      }
      .code-line .content {
        padding-left: 16px;
        white-space: pre;
        overflow-x: visible;
      }

      /* Comments tab */
      table.comments-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.comments-table th,
      table.comments-table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-muted);
        text-align: left;
        vertical-align: top;
      }
      table.comments-table th {
        background: var(--bg-subtle);
        position: sticky;
        top: 0;
        font-weight: 600;
      }
      table.comments-table .comment-text {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 0;
      }
      table.comments-table .comment-anchor {
        max-width: 0;
      }
      table.comments-table .anchor-code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
        max-width: 100%;
        vertical-align: middle;
      }
      table.comments-table .anchor-empty {
        color: var(--text-muted);
      }
      .comment-type-chip {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .comment-type-chip.inline {
        background: rgba(56, 139, 253, 0.15);
        color: #58a6ff;
      }
      .comment-type-chip.block {
        background: rgba(219, 109, 40, 0.15);
        color: #e3873c;
      }
      .comment-type-chip.docstring {
        background: rgba(46, 160, 67, 0.15);
        color: #3fb950;
      }
      table.comments-table.clickable tbody tr {
        cursor: pointer;
      }
      table.comments-table.clickable tbody tr:hover {
        background: #161b22;
      }

      /* Comment detail view */
      .detail-back-bar {
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-subtle);
      }
      .detail-back-bar button {
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }
      .detail-back-bar button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .comment-detail {
        padding: 20px 24px;
      }
      .comment-detail .cd-sub {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 14px;
        word-break: break-all;
      }
      .comment-detail .cd-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .comment-detail .cd-line {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--text-muted);
      }
      .comment-detail .cd-comment-text {
        margin: 0;
        padding: 14px 16px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .comment-detail .cd-hunk-title {
        margin-top: 20px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
      }
      .cd-note {
        margin: 0 24px;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--chip-modify-fg);
        background: var(--chip-modify);
        border-radius: 6px;
      }
      /* Mark the comment's own lines within the rendered hunk. Inset border
         instead of a background so it doesn't fight diff2html's add/del tints. */
      .cd-hunk .d2h-code-line.cmt-hl {
        box-shadow: inset 3px 0 0 var(--accent);
      }

      /* generations */
      .gen-badge {
        font-size: 10px;
        font-weight: 600;
        color: #bc8cff;
        background: rgba(163, 113, 247, 0.15);
        border-radius: 10px;
        padding: 1px 6px;
        flex-shrink: 0;
      }
      .filter-row label.gen-filter.active {
        background: #8957e5;
        border-color: #8957e5;
        color: #fff;
      }
      /* Per-model generations under a comment's detail view. */
      .model-gen-heading {
        margin: 8px 24px 4px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      /* Collapsible prompt shown once above a comment's model generations. */
      .gen-prompt {
        margin: 8px 24px 4px;
      }
      .gen-prompt summary {
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        user-select: none;
      }
      .gen-prompt summary:hover {
        color: var(--text);
      }
      .gen-prompt pre {
        margin: 8px 0 0;
        padding: 14px 16px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 360px;
        overflow: auto;
      }
      .gen-error-banner {
        margin: 16px 24px;
        padding: 16px;
        background: rgba(248, 81, 73, 0.1);
        border: 1px solid rgba(248, 81, 73, 0.4);
        border-radius: 6px;
        color: #f85149;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* diff2html tweaks */
      .d2h-wrapper {
        padding: 16px 24px;
      }
      .d2h-file-header {
        display: none;
      }
      /* diff2html line numbers are position:absolute; without a positioned
         ancestor they anchor to the viewport and stay fixed while .tab-panel
         scrolls. Anchor them to the scrolling file wrapper instead. */
      .d2h-file-wrapper {
        position: relative;
      }
      .d2h-code-line {
        line-height: 1.6;
      }

      /* ===== Header view toggle ===== */
      .view-toggle {
        margin-left: auto;
        display: flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        align-self: center;
      }
      .view-toggle button {
        background: var(--bg);
        border: none;
        color: var(--text-muted);
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .view-toggle button + button {
        border-left: 1px solid var(--border);
      }
      .view-toggle button:hover {
        color: var(--text);
      }
      .view-toggle button.active {
        background: var(--accent);
        color: #fff;
      }
      .gen-search {
        align-self: center;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 13px;
        width: 260px;
      }
      .gen-search::placeholder {
        color: var(--text-muted);
      }

      /* ===== Generations analysis view (ported from static_template.html,
         scoped under .gen-view so it can't collide with the full-data view) ===== */
      .gen-view {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        background: var(--bg);
      }
      .gen-view .gen-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 40px;
      }
      .gen-view .target-card {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 28px;
        overflow: hidden;
      }
      .gen-view .card-header {
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: flex-start;
        gap: 12px;
        cursor: pointer;
        user-select: none;
      }
      .gen-view .card-header:hover {
        background: var(--bg-subtle);
      }
      .gen-view .target-card.collapsed .card-header {
        border-bottom: none;
      }
      .gen-view .card-toggle {
        color: var(--text-muted);
        flex-shrink: 0;
        margin-top: 2px;
        transition: transform 0.15s ease;
      }
      .gen-view .target-card.collapsed .card-toggle {
        transform: rotate(-90deg);
      }
      .gen-view .target-card.collapsed .card-body {
        display: none;
      }
      .gen-view .ch-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .gen-view .ch-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gen-view .ch-chips {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .gen-view .ch-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .gen-view .ch-meta:empty {
        display: none;
      }
      .gen-view .card-header .repo {
        font-weight: 600;
        color: var(--text);
        flex-shrink: 0;
      }
      .gen-view .card-header a.repo {
        text-decoration: none;
      }
      .gen-view .card-header a.repo:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .gen-view .card-header .commit {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--text-muted);
      }
      .gen-view .card-header .path {
        color: var(--text-muted);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gen-view .card-header .lines {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      .gen-view .gchip {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .gen-view .gchip.inline,
      .gen-view .gchip.block,
      .gen-view .gchip.docstring {
        background: rgba(56, 139, 253, 0.15);
        color: #58a6ff;
      }
      .gen-view .gchip.added {
        background: var(--chip-add);
        color: var(--chip-add-fg);
      }
      .gen-view .gchip.modified {
        background: var(--chip-modify);
        color: var(--chip-modify-fg);
      }
      .gen-view .section-label {
        padding: 12px 20px 8px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gen-view .section-label .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .gen-view .section-label .dot.human {
        background: var(--human);
      }
      .gen-view .section-label .dot.model {
        background: var(--model);
      }
      .gen-view .prompt-wrap {
        padding: 0 20px 14px;
      }
      .gen-view .prompt-body {
        background: var(--bg-sunken);
        border: 1px solid var(--border-muted);
        border-radius: 8px;
        padding: 16px 20px;
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--text);
        overflow-x: auto;
      }
      .gen-view .prompt-body p {
        margin: 0 0 12px;
      }
      .gen-view .prompt-body p:last-child {
        margin-bottom: 0;
      }
      .gen-view .prompt-body h1,
      .gen-view .prompt-body h2,
      .gen-view .prompt-body h3 {
        margin: 18px 0 10px;
        font-weight: 600;
        color: var(--text);
        border-bottom: 1px solid var(--border-muted);
        padding-bottom: 4px;
      }
      .gen-view .prompt-body h1 {
        font-size: 15px;
      }
      .gen-view .prompt-body h2 {
        font-size: 14px;
      }
      .gen-view .prompt-body h3 {
        font-size: 13px;
      }
      .gen-view .prompt-body h1:first-child,
      .gen-view .prompt-body h2:first-child,
      .gen-view .prompt-body h3:first-child {
        margin-top: 0;
      }
      .gen-view .prompt-body ol,
      .gen-view .prompt-body ul {
        margin: 0 0 12px;
        padding-left: 22px;
      }
      .gen-view .prompt-body li {
        margin: 3px 0;
      }
      .gen-view .prompt-body :not(pre) > code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: rgba(110, 118, 129, 0.2);
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 0.92em;
        color: #f0883e;
      }
      .gen-view .prompt-body pre {
        margin: 12px 0;
        padding: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .gen-view .prompt-body pre > code.hljs {
        display: block;
        padding: 12px 14px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        background: var(--bg);
        white-space: pre;
        overflow-x: auto;
      }
      /* The change-block diff is rendered by diff2html (like the full-data
         view) for a GitHub-style review look. Cap its height so a long hunk
         doesn't blow out the card; it scrolls internally. */
      .gen-view .gen-diff {
        margin: 12px 0;
        max-height: 480px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .gen-view .gen-diff .d2h-wrapper {
        padding: 0;
      }
      .gen-view .comments-grid {
        padding: 4px 20px 20px;
        display: grid;
        gap: 14px;
      }
      .gen-view .comment-block {
        background: var(--bg-sunken);
        border: 1px solid var(--border-muted);
        border-radius: 8px;
        overflow: hidden;
      }
      .gen-view .comment-block.human {
        border-color: rgba(63, 185, 80, 0.35);
      }
      .gen-view .comment-block.model {
        border-color: rgba(188, 140, 255, 0.3);
      }
      .gen-view .comment-block .cb-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-muted);
        font-size: 12px;
        font-weight: 600;
      }
      .gen-view .comment-block.human .cb-head {
        background: rgba(63, 185, 80, 0.08);
        color: var(--human);
      }
      .gen-view .comment-block.model .cb-head {
        background: rgba(188, 140, 255, 0.08);
        color: var(--model);
      }
      .gen-view .comment-block pre {
        margin: 0;
        padding: 12px 14px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
        background: var(--bg-sunken);
      }
      .gen-view .comment-block.error pre {
        color: var(--chip-error-fg);
      }
      .gen-view .comment-block.error .cb-head {
        background: var(--chip-error);
        color: var(--chip-error-fg);
      }
      .gen-view .gen-empty {
        padding: 80px 20px;
        text-align: center;
        color: var(--text-muted);
      }
      .gen-view .gen-empty h2 {
        margin: 0 0 8px;
        color: var(--text);
        font-size: 16px;
      }
      .gen-view .anchor-pill {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 7px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
        display: inline-block;
        vertical-align: middle;
      }
      .gen-view .gen-footer {
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
        padding: 20px;
        border-top: 1px solid var(--border-muted);
      }
      /* Reading-position rail: one block per card, pinned to the right edge,
         with the block for the card in view highlighted. */
      .gen-view .gen-progress {
        position: fixed;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 20;
        max-height: 80vh;
        overflow-y: auto;
        padding: 6px;
        scrollbar-width: none;
      }
      .gen-view .gen-progress::-webkit-scrollbar {
        display: none;
      }
      .gen-view .gen-progress .pblock {
        width: 18px;
        height: 6px;
        flex-shrink: 0;
        border: none;
        padding: 0;
        border-radius: 2px;
        background: #484f58;
        cursor: pointer;
        transition:
          background 0.12s ease,
          transform 0.12s ease;
      }
      .gen-view .gen-progress .pblock:hover {
        transform: scaleX(1.25);
      }
      /* Reviewed = green fill; current scroll position = accent ring on top,
         so a block can show both at once. */
      .gen-view .gen-progress .pblock.reviewed {
        background: var(--chip-add-fg);
      }
      .gen-view .gen-progress .pblock.active {
        box-shadow: 0 0 0 2px var(--accent);
      }

      /* ===== Review checkbox, notes, save button ===== */
      .gen-view .review-check {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        margin-top: 1px;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
        user-select: none;
      }
      .gen-view .review-check input {
        cursor: pointer;
        accent-color: var(--chip-add-fg);
      }
      .gen-view .ch-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .gen-view .card-copy {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-muted);
        padding: 5px;
        line-height: 0;
        cursor: pointer;
      }
      .gen-view .card-copy:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .gen-view .card-copy.copied {
        color: var(--chip-add-fg);
        border-color: var(--chip-add-fg);
      }
      .gen-view .card-copy .icon {
        width: 15px;
        height: 15px;
      }
      .gen-view .target-card.reviewed {
        border-color: rgba(63, 185, 80, 0.5);
      }
      .gen-view .target-card.reviewed .card-header {
        background: rgba(63, 185, 80, 0.08);
      }
      .gen-view .target-card.reviewed .card-header:hover {
        background: rgba(63, 185, 80, 0.13);
      }
      .gen-view .target-card.reviewed .review-check {
        color: var(--chip-add-fg);
        font-weight: 600;
      }
      .gen-view .note-input {
        width: 100%;
        margin-top: 8px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 12.5px;
        line-height: 1.5;
        resize: vertical;
        min-height: 38px;
      }
      .gen-view .note-input::placeholder {
        color: var(--text-muted);
      }
      .gen-view .note-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .gen-view .model-note-wrap {
        padding: 0 12px 12px;
      }
      .gen-view .model-note-wrap .note-input {
        margin-top: 0;
      }
      .gen-review-count {
        align-self: center;
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .gen-save {
        align-self: center;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 7px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .gen-save:hover {
        filter: brightness(1.08);
      }
      .gen-save:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .gen-save.clean {
        background: var(--bg);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .gen-save.dirty::after {
        content: "•";
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Research Dashboard</h1>
      <span class="meta" id="dataset-meta"></span>
      <div class="view-toggle" id="view-toggle" style="display: none">
        <button data-view="data" class="active">Full data</button>
        <button data-view="gen">Generations</button>
      </div>
      <input
        type="text"
        id="gen-search"
        class="gen-search"
        placeholder="Filter by repo, path, or comment text"
        style="display: none"
      />
      <span
        id="gen-review-count"
        class="gen-review-count"
        style="display: none"
      ></span>
      <button
        type="button"
        id="gen-save"
        class="gen-save clean"
        style="display: none"
      >
        Saved
      </button>
    </header>
    <main>
      <aside class="sidebar">
        <div class="sidebar-controls">
          <input
            type="text"
            id="search"
            placeholder="Search filename / path / repo"
          />
          <div class="filter-row" id="change-type-filters"></div>
          <div class="sidebar-count" id="sidebar-count"></div>
        </div>
        <ul class="records" id="records-list"></ul>
      </aside>
      <section class="detail">
        <div class="detail-header" id="detail-header">
          <div class="empty-state">Select a record from the list</div>
        </div>
        <div class="tabs" id="tabs" style="display: none"></div>
        <div class="tab-panel" id="tab-panel"></div>
      </section>
    </main>

    <div class="gen-view" id="gen-view" style="display: none">
      <div class="gen-progress" id="gen-progress" aria-hidden="true"></div>
      <div class="gen-inner" id="gen-root"></div>
      <footer class="gen-footer">
        <span id="gen-count"></span> · built from <span id="gen-source"></span>
      </footer>
    </div>

    <script>
      const TABS = [
        { id: "diff", label: "Diff" },
        { id: "cur", label: "Current" },
        { id: "prev", label: "Previous" },
        { id: "comments", label: "Comments" },
        { id: "raw", label: "Raw JSON" },
      ];

      const PAGE_SIZE = 200;

      // Minimal inline SVG icons (Feather, MIT-licensed). Inlined as strings
      // rather than pulled from a runtime icon library so they work with the
      // dashboard's dynamically-built DOM without a re-scan step.
      const ICON_PATHS = {
        zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        "alert-triangle":
          '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
        "arrow-left":
          '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
        "chevron-down": '<polyline points="6 9 12 15 18 9"/>',
        copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
      };

      function iconSvg(name, extraClass = "") {
        const cls = extraClass ? `icon ${extraClass}` : "icon";
        return (
          `<svg class="${cls}" viewBox="0 0 24 24" fill="none" ` +
          'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
          `stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`
        );
      }

      const state = {
        rows: [],
        total: 0,
        nextOffset: 0,
        loading: false,
        changeTypes: [],
        search: "",
        activeChangeTypes: new Set(),
        genOnly: false,
        selectedIndex: null,
        currentRecord: null,
        activeTab: "diff",
        commentDetail: null,
        repoKey: null,
        repoCountEl: null,
        repoCount: 0,
        commitKey: null,
        commitCountEl: null,
        commitCount: 0,
      };

      async function loadMeta() {
        const response = await fetch("/meta");
        const meta = await response.json();
        document.getElementById("dataset-meta").textContent =
          `${meta.count} records across ${meta.repo_count} repos · ${meta.comment_count} comments (${meta.sidebar_comment_count} added/modified inline/block)`;
        state.changeTypes = meta.change_types || [];
        if (meta.has_generations) {
          document.getElementById("view-toggle").style.display = "flex";
        }
        initChangeTypeFilters();
        await reloadRecords();
      }

      function initChangeTypeFilters() {
        state.activeChangeTypes = new Set(state.changeTypes);
        const container = document.getElementById("change-type-filters");
        container.innerHTML = "";

        const genLabel = document.createElement("label");
        genLabel.className = "gen-filter";
        genLabel.innerHTML = `${iconSvg("zap")} generated only`;
        genLabel.addEventListener("click", () => {
          state.genOnly = !state.genOnly;
          genLabel.classList.toggle("active", state.genOnly);
          reloadRecords();
        });
        container.appendChild(genLabel);

        for (const type of state.changeTypes) {
          const label = document.createElement("label");
          label.className = "active";
          label.textContent = type;
          label.dataset.type = type;
          label.addEventListener("click", () => {
            if (state.activeChangeTypes.has(type)) {
              state.activeChangeTypes.delete(type);
              label.classList.remove("active");
            } else {
              state.activeChangeTypes.add(type);
              label.classList.add("active");
            }
            reloadRecords();
          });
          container.appendChild(label);
        }
      }

      function recordsQuery(offset) {
        const params = new URLSearchParams();
        params.set("offset", String(offset));
        params.set("limit", String(PAGE_SIZE));
        const query = state.search.trim();
        if (query) params.set("q", query);
        if (state.activeChangeTypes.size !== state.changeTypes.length) {
          params.set("types", Array.from(state.activeChangeTypes).join(","));
        }
        if (state.genOnly) params.set("gen", "1");
        return params.toString();
      }

      async function reloadRecords() {
        state.rows = [];
        state.total = 0;
        state.nextOffset = 0;
        state.repoKey = null;
        state.repoCountEl = null;
        state.repoCount = 0;
        state.commitKey = null;
        state.commitCountEl = null;
        state.commitCount = 0;
        document.getElementById("records-list").innerHTML = "";
        await loadMoreRecords();
      }

      async function loadMoreRecords() {
        if (state.loading) return;
        if (state.rows.length && state.rows.length >= state.total) return;
        state.loading = true;
        const response = await fetch(
          `/records?${recordsQuery(state.nextOffset)}`,
        );
        const data = await response.json();
        state.total = data.total;
        state.nextOffset += data.rows.length;
        appendRows(data.rows);
        updateSidebarCount();
        state.loading = false;
        maybeLoadMore();
      }

      function maybeLoadMore() {
        const list = document.getElementById("records-list");
        const hasMore = state.rows.length < state.total;
        const notScrollable = list.scrollHeight <= list.clientHeight;
        if (hasMore && notScrollable) loadMoreRecords();
      }

      function appendRepoHeader(list, r) {
        const repo = r.repo_name || "(no repo)";
        const header = document.createElement("li");
        header.className = "repo-header";
        header.innerHTML = `
    ${repoLink(repo, "repo-name")}
    <span class="repo-count"></span>
  `;
        list.appendChild(header);
        state.repoCountEl = header.querySelector(".repo-count");
        state.repoCount = 0;
      }

      function appendCommitHeader(list, r) {
        const hash = r.commit_hash ? r.commit_hash.slice(0, 7) : "(no commit)";
        const header = document.createElement("li");
        header.className = "commit-header";
        header.innerHTML = `
    <span class="commit-hash">${escapeHTML(hash)}</span>
    <span class="commit-count"></span>
  `;
        list.appendChild(header);
        state.commitCountEl = header.querySelector(".commit-count");
        state.commitCount = 0;
      }

      function fileLabel(count) {
        return `${count} file${count === 1 ? "" : "s"}`;
      }

      function appendRows(rows) {
        const list = document.getElementById("records-list");
        for (const r of rows) {
          state.rows.push(r);
          const idx = r.index;
          const repoKey = r.repo_name || "";
          const commitKey = `${repoKey}@${r.commit_hash || ""}`;
          if (repoKey !== state.repoKey) {
            state.repoKey = repoKey;
            state.commitKey = null;
            appendRepoHeader(list, r);
          }
          if (commitKey !== state.commitKey) {
            state.commitKey = commitKey;
            appendCommitHeader(list, r);
          }
          state.repoCount += 1;
          if (state.repoCountEl) {
            state.repoCountEl.textContent = fileLabel(state.repoCount);
          }
          state.commitCount += 1;
          if (state.commitCountEl) {
            state.commitCountEl.textContent = fileLabel(state.commitCount);
          }
          const li = document.createElement("li");
          li.className = "record";
          li.dataset.index = String(idx);
          if (state.selectedIndex === idx) li.classList.add("selected");

          const row1 = document.createElement("div");
          row1.className = "row1";
          const chip = document.createElement("span");
          chip.className = "chip " + (r.change_type || "");
          chip.textContent = r.change_type || "?";
          const name = document.createElement("span");
          name.className = "filename";
          name.textContent = r.new_path || r.filename || `#${idx}`;
          name.title = r.new_path || r.filename || "";
          const nloc = document.createElement("span");
          nloc.className = "nloc";
          nloc.textContent = r.nloc != null ? `${r.nloc} loc` : "";
          row1.append(chip, name, nloc);

          li.append(row1);
          const comments = r.sidebar_comments || [];
          if (comments.length) {
            li.appendChild(buildRecordComments(idx, comments));
          }
          li.addEventListener("click", () => selectRecord(idx));
          list.appendChild(li);
        }
      }

      function buildRecordComments(idx, comments) {
        const container = document.createElement("div");
        container.className = "record-comments";
        comments.forEach((c, filteredIndex) => {
          const item = document.createElement("div");
          item.className = "record-comment";

          const meta = document.createElement("div");
          meta.className = "rc-meta";
          const typeChip = document.createElement("span");
          typeChip.className = "comment-type-chip " + (c.type || "");
          typeChip.textContent = c.type || "";
          const statusPill = document.createElement("span");
          statusPill.className = "status-pill " + (c.status || "");
          statusPill.textContent = c.status || "";
          if (c.generation_model_count != null) {
            const gen = document.createElement("span");
            gen.className = "gen-badge";
            gen.innerHTML = `${iconSvg("zap")}${c.generation_model_count}`;
            gen.title = `Generated by ${c.generation_model_count} model${
              c.generation_model_count === 1 ? "" : "s"
            }`;
            meta.append(typeChip, statusPill, gen);
          } else {
            meta.append(typeChip, statusPill);
          }
          const line = document.createElement("span");
          line.className = "rc-line";
          line.textContent =
            c.start_line === c.end_line
              ? `L${c.start_line}`
              : `L${c.start_line}-${c.end_line}`;
          meta.append(line);

          const text = document.createElement("div");
          text.className = "rc-text";
          text.textContent = c.comment || "";
          text.title = c.comment || "";

          item.append(meta, text);
          item.addEventListener("click", (event) => {
            event.stopPropagation();
            openRecordCommentDetail(idx, filteredIndex);
          });
          container.appendChild(item);
        });
        return container;
      }

      function markSelection() {
        for (const li of document.querySelectorAll("#records-list li.record")) {
          li.classList.toggle(
            "selected",
            Number(li.dataset.index) === state.selectedIndex,
          );
        }
      }

      function updateSidebarCount() {
        document.getElementById("sidebar-count").textContent =
          `${state.rows.length} of ${state.total} matching`;
      }

      async function loadRecord(index) {
        if (state.selectedIndex === index && state.currentRecord) return;
        state.selectedIndex = index;
        markSelection();
        const response = await fetch(`/records/${index}`);
        state.currentRecord = await response.json();
      }

      async function selectRecord(index) {
        state.commentDetail = null;
        await loadRecord(index);
        renderDetailHeader();
        renderTabs();
        renderActiveTab();
      }

      async function openRecordCommentDetail(index, filteredIndex) {
        await loadRecord(index);
        state.activeTab = "comments";
        state.commentDetail = { filteredIndex };
        renderDetailHeader();
        renderTabs();
        renderActiveTab();
      }

      function renderDetailHeader() {
        const r = state.currentRecord;
        const header = document.getElementById("detail-header");
        const hashShort = r.commit_hash ? r.commit_hash.slice(0, 7) : "";
        header.innerHTML = `
    <div class="detail-title">${escapeHTML(r.new_path || r.filename || "")}</div>
    <div class="detail-sub">
      ${escapeHTML(r.repo_name || "(no repo)")}${hashShort ? " @ " + escapeHTML(hashShort) : ""}
    </div>
    <div class="badges">
      <span class="chip ${r.change_type || ""}">${escapeHTML(r.change_type || "")}</span>
      <span class="badge add">+${r.added_lines ?? 0}</span>
      <span class="badge del">-${r.deleted_lines ?? 0}</span>
      <span class="badge">nloc ${r.nloc ?? "?"}</span>
      <span class="badge">complexity ${r.complexity ?? "?"}</span>
      <span class="badge">tokens ${r.token_count ?? "?"}</span>
      <span class="badge">${(r.comments || []).length} comments</span>
    </div>
  `;
      }

      function renderTabs() {
        const tabs = document.getElementById("tabs");
        tabs.style.display = "flex";
        tabs.innerHTML = "";
        for (const tab of TABS) {
          const button = document.createElement("button");
          button.textContent = tab.label;
          if (tab.id === state.activeTab) button.classList.add("active");
          button.addEventListener("click", () => {
            state.activeTab = tab.id;
            state.commentDetail = null;
            renderTabs();
            renderActiveTab();
          });
          tabs.appendChild(button);
        }
      }

      function renderActiveTab() {
        const panel = document.getElementById("tab-panel");
        panel.innerHTML = "";
        const r = state.currentRecord;
        if (!r) return;

        if (state.commentDetail) return renderCommentDetail(panel);

        switch (state.activeTab) {
          case "diff":
            return renderDiff(panel, r);
          case "cur":
            return renderCode(panel, r.source_code, r.comments || []);
          case "prev":
            return renderCode(panel, r.previous_source_code, []);
          case "comments":
            return renderComments(panel, r.comments || [], { kind: "record" });
          case "raw":
            return renderRaw(panel, r);
        }
      }

      function renderDiff(panel, record) {
        if (!record.diff) {
          panel.innerHTML = `<div class="empty-state">No diff available.</div>`;
          return;
        }
        const fakePath = record.new_path || record.filename || "file.py";
        const unified =
          `diff --git a/${fakePath} b/${fakePath}\n` +
          `--- a/${fakePath}\n+++ b/${fakePath}\n` +
          record.diff;
        const ui = new Diff2HtmlUI(panel, unified, {
          drawFileList: false,
          matching: "lines",
          outputFormat: "line-by-line",
          highlight: true,
          colorScheme: "dark",
        });
        ui.draw();
        ui.highlightCode();
      }

      function renderCode(panel, code, comments) {
        if (code == null) {
          panel.innerHTML = `<div class="empty-state">No content for this variant.</div>`;
          return;
        }
        const commentLineSet = new Set();
        for (const c of comments) {
          const start = c.start_line ?? 0;
          const end = c.end_line ?? start;
          for (let l = start; l <= end; l++) commentLineSet.add(l);
        }
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        const lines = code.split("\n");
        let highlighted;
        try {
          highlighted = hljs.highlight(code, {
            language: "python",
            ignoreIllegals: true,
          }).value;
        } catch {
          highlighted = escapeHTML(code);
        }
        const highlightedLines = highlighted.split("\n");
        const frag = document.createDocumentFragment();
        for (let i = 0; i < lines.length; i++) {
          const lineNumber = i + 1;
          const row = document.createElement("div");
          row.className = "code-line";
          if (commentLineSet.has(lineNumber)) row.classList.add("has-comment");
          row.innerHTML = `
      <span class="lineno">${lineNumber}</span>
      <span class="marker" title="${commentLineSet.has(lineNumber) ? "comment" : ""}"></span>
      <span class="content hljs">${highlightedLines[i] ?? ""}</span>
    `;
          frag.appendChild(row);
        }
        wrap.appendChild(frag);
        panel.appendChild(wrap);
      }

      const COMMENT_TYPES = new Set(["inline", "block"]);
      const COMMENT_STATUSES = new Set(["added", "modified"]);

      function filterDetailComments(comments) {
        return (comments || []).filter(
          (c) =>
            COMMENT_TYPES.has(c.type || "") &&
            COMMENT_STATUSES.has(c.status || ""),
        );
      }

      function renderComments(panel, comments, context) {
        const visible = filterDetailComments(comments);
        if (!visible.length) {
          panel.innerHTML = `<div class="empty-state">No added or modified inline/block comments on this record.</div>`;
          return;
        }

        const table = document.createElement("table");
        table.className = "comments-table";
        if (context) table.classList.add("clickable");
        table.innerHTML = `
    <thead>
      <tr>
        <th style="width:90px;">Type</th>
        <th style="width:90px;">Status</th>
        <th style="width:90px;">Lines</th>
        <th>Comment</th>
        <th>Anchor</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
        const tbody = table.querySelector("tbody");
        visible.forEach((c, filteredIndex) => {
          const tr = document.createElement("tr");
          const type = c.type || "";
          const status = c.status || "";
          const lines =
            c.start_line === c.end_line
              ? `${c.start_line}`
              : `${c.start_line}-${c.end_line}`;
          const anchorText = c.anchor == null ? "" : c.anchor;
          const anchorHTML = anchorText
            ? `<code class="anchor-code">${escapeHTML(anchorText)}</code>`
            : `<span class="anchor-empty">—</span>`;
          tr.innerHTML = `
        <td><span class="comment-type-chip ${escapeHTML(type)}">${escapeHTML(type)}</span></td>
        <td><span class="status-pill ${escapeHTML(status)}">${escapeHTML(status)}</span></td>
        <td>${escapeHTML(lines)}</td>
        <td class="comment-text">${escapeHTML(c.comment ?? "")}</td>
        <td class="comment-anchor">${anchorHTML}</td>
      `;
          if (context) {
            tr.addEventListener("click", () => {
              openRecordCommentDetail(state.selectedIndex, filteredIndex);
            });
          }
          tbody.appendChild(tr);
        });
        panel.appendChild(table);
      }

      function parseDiffHunks(diffText) {
        const hunks = [];
        const headerRe = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/;
        let current = null;
        for (const line of (diffText || "").split("\n")) {
          const match = line.match(headerRe);
          if (match) {
            const newStart = parseInt(match[1], 10);
            const newCount = match[2] === undefined ? 1 : parseInt(match[2], 10);
            current = {
              newStart,
              newEnd: newStart + Math.max(newCount, 1) - 1,
              lines: [line],
            };
            hunks.push(current);
          } else if (current) {
            current.lines.push(line);
          }
        }
        return hunks;
      }

      function buildHunkDiff(path, hunks) {
        const header =
          `diff --git a/${path} b/${path}\n` +
          `--- a/${path}\n` +
          `+++ b/${path}\n`;
        return header + hunks.map((h) => h.lines.join("\n")).join("\n") + "\n";
      }

      function highlightCommentLines(container, comment) {
        // Unified (line-by-line) rows carry the new-file line number in
        // `.line-num2` (empty for deleted lines); mark code cells in range.
        for (const row of container.querySelectorAll("tr")) {
          const codeCell = row.querySelector("td.d2h-code-line");
          const newNumCell = row.querySelector(".line-num2");
          if (!codeCell || !newNumCell) continue;
          const n = parseInt(newNumCell.textContent.trim(), 10);
          if (Number.isNaN(n)) continue;
          if (n >= comment.start_line && n <= comment.end_line) {
            codeCell.classList.add("cmt-hl");
          }
        }
      }

      function renderCommentDetail(panel) {
        const record = state.currentRecord;
        const detail = state.commentDetail;
        const comments = filterDetailComments(record.comments || []);
        const comment = comments[detail.filteredIndex];

        const backBar = document.createElement("div");
        backBar.className = "detail-back-bar";
        const backButton = document.createElement("button");
        backButton.innerHTML = `${iconSvg("arrow-left")} Back to comments`;
        backButton.addEventListener("click", () => {
          state.commentDetail = null;
          renderActiveTab();
        });
        backBar.appendChild(backButton);
        panel.appendChild(backBar);

        if (!comment) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "This comment is no longer available.";
          panel.appendChild(empty);
          return;
        }

        const path = record.new_path || record.filename || "file.py";

        // The human comment and its diff hunk, pulled from the file's full diff.
        appendCommentBlock(panel, {
          path,
          comment,
          commentText: comment.comment || "",
          diffText: record.diff || "",
          hunkTitle: "Diff hunk",
          hunkMode: "human",
        });

        // Below it, every model that generated a comment for this same target.
        appendModelGenerations(panel, record, comment, path);
      }

      // Render a comment's text plus its diff hunk into `panel`. In "human" mode
      // the diff is the file's full diff, narrowed to the hunk overlapping the
      // comment; in "model" mode it's the small source→applied diff rendered
      // whole, with the model's inserted comment lines highlighted.
      function appendCommentBlock(panel, opts) {
        const { path, comment, model, commentText, diffText, hunkTitle, hunkMode } =
          opts;
        const lines =
          comment.start_line === comment.end_line
            ? `L${comment.start_line}`
            : `L${comment.start_line}-${comment.end_line}`;
        const anchorHTML =
          comment.anchor == null || comment.anchor === ""
            ? ""
            : `<code class="anchor-code">${escapeHTML(comment.anchor)}</code>`;

        const body = document.createElement("div");
        body.className = "comment-detail";
        body.innerHTML = `
    ${model ? `<div class="cd-sub">${escapeHTML(model)}</div>` : ""}
    <div class="cd-meta">
      <span class="comment-type-chip ${escapeHTML(comment.type || "")}">${escapeHTML(comment.type || "")}</span>
      <span class="status-pill ${escapeHTML(comment.status || "")}">${escapeHTML(comment.status || "")}</span>
      <span class="cd-line">${escapeHTML(lines)}</span>
      ${anchorHTML}
    </div>
    <pre class="cd-comment-text"></pre>
    <div class="cd-hunk-title">${escapeHTML(hunkTitle)}</div>
  `;
        body.querySelector(".cd-comment-text").textContent = commentText;
        panel.appendChild(body);

        const hunkArea = document.createElement("div");
        hunkArea.className = "cd-hunk";
        panel.appendChild(hunkArea);

        if (!diffText.trim()) {
          hunkArea.innerHTML = `<div class="empty-state">No diff available for this comment.</div>`;
          return;
        }

        const allHunks = parseDiffHunks(diffText);
        let hunks = allHunks;
        let highlightFn;
        if (hunkMode === "model") {
          highlightFn = highlightInsertedLines;
        } else {
          const overlapping = allHunks.filter(
            (h) => h.newStart <= comment.end_line && h.newEnd >= comment.start_line,
          );
          if (overlapping.length) {
            hunks = overlapping;
          } else {
            const note = document.createElement("div");
            note.className = "cd-note";
            note.textContent =
              "Couldn't isolate a specific hunk for this comment; showing the full diff.";
            hunkArea.appendChild(note);
          }
          highlightFn = (container) => highlightCommentLines(container, comment);
        }

        if (!hunks.length) {
          hunkArea.innerHTML = `<div class="empty-state">No diff available for this comment.</div>`;
          return;
        }

        const diffContainer = document.createElement("div");
        hunkArea.appendChild(diffContainer);
        const ui = new Diff2HtmlUI(diffContainer, buildHunkDiff(path, hunks), {
          drawFileList: false,
          matching: "lines",
          outputFormat: "line-by-line",
          highlight: true,
          colorScheme: "dark",
        });
        ui.draw();
        ui.highlightCode();
        highlightFn(diffContainer);
      }

      // Mark every inserted (new-side) line in a model's diff hunk. Since the
      // model only swaps the comment, those lines are exactly its comment.
      function highlightInsertedLines(container) {
        for (const codeCell of container.querySelectorAll(
          "td.d2h-code-line.d2h-ins",
        )) {
          codeCell.classList.add("cmt-hl");
        }
      }

      // The prompt is built per comment target and is identical across the
      // models run on it, so show it once for the whole generation group.
      function appendGenerationPrompt(panel, results) {
        const promptText = (results.find((r) => r.prompt) || {}).prompt || "";
        if (!promptText) return;
        const details = document.createElement("details");
        details.className = "gen-prompt";
        const summary = document.createElement("summary");
        summary.textContent = "Prompt";
        const pre = document.createElement("pre");
        pre.textContent = promptText;
        details.append(summary, pre);
        panel.appendChild(details);
      }

      function appendModelGenerations(panel, record, comment, path) {
        // Newer records flatten the target fields onto the generation itself;
        // older ones nest them under `target`. Support both.
        const generation = (record.comment_generations || []).find((g) => {
          const target = g.target || g;
          return (
            target.type === comment.type &&
            target.anchor === comment.anchor &&
            target.start_line === comment.start_line &&
            target.end_line === comment.end_line
          );
        });

        const heading = document.createElement("div");
        heading.className = "model-gen-heading";
        heading.textContent = "Model generations";
        panel.appendChild(heading);

        const results = (generation && generation.results) || [];
        if (!results.length) {
          const note = document.createElement("div");
          note.className = "empty-state";
          note.textContent = "No model generations for this comment.";
          panel.appendChild(note);
          return;
        }

        appendGenerationPrompt(panel, results);

        const sorted = results
          .slice()
          .sort((a, b) => (a.model || "").localeCompare(b.model || ""));
        for (const result of sorted) {
          const modelName =
            (result.model || "").split("/").pop() || "(unknown model)";
          if (result.error || !result.comment_text) {
            const block = document.createElement("div");
            block.className = "comment-detail";
            block.innerHTML = `<div class="cd-sub">${escapeHTML(modelName)}</div>`;
            const banner = document.createElement("div");
            banner.className = "gen-error-banner";
            banner.innerHTML = `${iconSvg("alert-triangle")} ${escapeHTML(
              result.error || "No comment generated.",
            )}`;
            block.appendChild(banner);
            panel.appendChild(block);
            continue;
          }
          appendCommentBlock(panel, {
            path,
            comment,
            model: modelName,
            commentText: result.comment_text,
            diffText: result.diff || "",
            hunkTitle: "Model diff hunk",
            hunkMode: "model",
          });
        }
      }

      function renderRaw(panel, record) {
        const json = JSON.stringify(record, null, 2);
        const pre = document.createElement("pre");
        pre.style.margin = "0";
        pre.style.padding = "20px 24px";
        pre.style.fontSize = "12px";
        pre.style.lineHeight = "1.6";
        pre.style.whiteSpace = "pre-wrap";
        pre.style.wordBreak = "break-word";
        const code = document.createElement("code");
        code.className = "hljs language-json";
        code.style.padding = "0";
        code.style.background = "transparent";
        try {
          code.innerHTML = hljs.highlight(json, {
            language: "json",
            ignoreIllegals: true,
          }).value;
        } catch {
          code.textContent = json;
        }
        pre.appendChild(code);
        panel.appendChild(pre);
      }

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Render an owner/repo name as a link to its GitHub repo. Falls back to a
      // plain span when the name isn't a recognizable owner/repo slug.
      function repoLink(repoName, className) {
        const safe = escapeHTML(repoName);
        if (repoName && repoName.includes("/") && repoName !== "(no repo)") {
          const href =
            "https://github.com/" +
            repoName.split("/").map(encodeURIComponent).join("/");
          return (
            `<a class="${className}" href="${escapeHTML(href)}" ` +
            `target="_blank" rel="noopener noreferrer" title="${safe}">${safe}</a>`
          );
        }
        return `<span class="${className}" title="${safe}">${safe}</span>`;
      }

      let searchTimer = null;
      document.getElementById("search").addEventListener("input", (event) => {
        state.search = event.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(reloadRecords, 200);
      });

      document
        .getElementById("records-list")
        .addEventListener("scroll", (event) => {
          const list = event.target;
          if (list.scrollTop + list.clientHeight >= list.scrollHeight - 200) {
            loadMoreRecords();
          }
        });

      // ===== Generations analysis view =====
      // Ported from static_template.html. Data is fetched once from
      // /generations on the first switch and cached; the whole comparison
      // list is rendered client-side and filtered by the header search box.
      const gen = {
        loaded: false,
        markedReady: false,
        data: null,
        query: "",
        notes: {},
        dirty: false,
        cardByKey: {},
        blockByKey: {},
      };

      function setView(view) {
        const isGen = view === "gen";
        document.querySelector("main").style.display = isGen ? "none" : "";
        document.getElementById("gen-view").style.display = isGen ? "" : "none";
        for (const id of ["gen-search", "gen-review-count", "gen-save"]) {
          document.getElementById(id).style.display = isGen ? "" : "none";
        }
        for (const button of document.querySelectorAll("#view-toggle button")) {
          button.classList.toggle("active", button.dataset.view === view);
        }
        if (isGen) ensureGenerations();
      }

      async function ensureGenerations() {
        if (gen.loaded) return;
        gen.loaded = true;
        configureMarked();
        const [genResponse, notesResponse] = await Promise.all([
          fetch("/generations"),
          fetch("/notes"),
        ]);
        gen.data = await genResponse.json();
        gen.notes = (await notesResponse.json()).entries || {};
        gen.dirty = false;
        renderGenerations();
        updateSaveButton();
        updateReviewCount();
      }

      // Notes/review state is keyed by target.key. Read with a safe default at
      // render time; create the backing entry only when the user edits.
      function noteEntry(key) {
        let entry = gen.notes[key];
        if (!entry) {
          entry = { reviewed: false, note: "", model_notes: {} };
          gen.notes[key] = entry;
        }
        if (!entry.model_notes) entry.model_notes = {};
        return entry;
      }

      function markDirty() {
        gen.dirty = true;
        updateSaveButton();
      }

      function updateSaveButton() {
        const button = document.getElementById("gen-save");
        button.classList.toggle("dirty", gen.dirty);
        button.classList.toggle("clean", !gen.dirty);
        button.textContent = gen.dirty ? "Save" : "Saved";
      }

      function updateReviewCount() {
        const targets = gen.data ? gen.data.targets : [];
        let reviewed = 0;
        for (const target of targets) {
          const entry = gen.notes[target.key];
          if (entry && entry.reviewed) reviewed += 1;
        }
        document.getElementById("gen-review-count").textContent =
          `${reviewed}/${targets.length} reviewed`;
      }

      async function saveNotes() {
        if (!gen.loaded) return;
        const entries = {};
        for (const [key, entry] of Object.entries(gen.notes)) {
          const modelNotes = {};
          for (const [model, text] of Object.entries(entry.model_notes || {})) {
            if (text && text.trim()) modelNotes[model] = text;
          }
          const hasContent =
            entry.reviewed ||
            (entry.note && entry.note.trim()) ||
            Object.keys(modelNotes).length > 0;
          if (!hasContent) continue;
          entries[key] = {
            reviewed: !!entry.reviewed,
            note: entry.note || "",
            model_notes: modelNotes,
          };
        }
        const button = document.getElementById("gen-save");
        button.disabled = true;
        try {
          const response = await fetch("/notes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ entries }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          gen.dirty = false;
          updateSaveButton();
        } catch (error) {
          alert("Failed to save notes: " + error.message);
        } finally {
          button.disabled = false;
        }
      }

      // Configure marked once; ask highlight.js to colorize each fenced code
      // block using its declared language (the server emits ```python and
      // ```diff for prompts).
      function configureMarked() {
        if (gen.markedReady) return;
        gen.markedReady = true;
        marked.setOptions({
          gfm: true,
          breaks: false,
          highlight: (code, lang) => {
            if (!lang) return escapeHTML(code);
            try {
              return hljs.highlight(code, { language: lang, ignoreIllegals: true })
                .value;
            } catch {
              return escapeHTML(code);
            }
          },
        });
      }

      function genLineLabel(target) {
        if (target.start_line == null) return "";
        if (target.start_line === target.end_line) return `L${target.start_line}`;
        return `L${target.start_line}-${target.end_line}`;
      }

      function renderPrompt(container, target) {
        if (!target.prompt) {
          container.innerHTML = `<div class="gen-empty" style="padding:24px;">No prompt available.</div>`;
          return;
        }
        const body = document.createElement("div");
        body.className = "prompt-body";
        body.innerHTML = marked.parse(target.prompt);
        // marked's highlight option fills the inner HTML but doesn't set the
        // language class hljs needs for its themed selectors; add it.
        for (const codeEl of body.querySelectorAll("pre > code")) {
          if (!codeEl.classList.contains("hljs")) codeEl.classList.add("hljs");
        }
        renderPromptDiffs(body, target);
        container.appendChild(body);
      }

      // The <change> tag is emitted as a ```diff fenced block. Replace each one
      // with a diff2html render so it reads like a GitHub PR review. The change
      // block is a bare hunk (no file header); synthesize one from the target's
      // path, the same way the full-data view does.
      function renderPromptDiffs(body, target) {
        const path = target.path || "file.py";
        for (const codeEl of body.querySelectorAll("pre > code.language-diff")) {
          const pre = codeEl.closest("pre");
          if (!pre) continue;
          const unified =
            `diff --git a/${path} b/${path}\n` +
            `--- a/${path}\n+++ b/${path}\n` +
            codeEl.textContent;
          const container = document.createElement("div");
          container.className = "gen-diff";
          const ui = new Diff2HtmlUI(container, unified, {
            drawFileList: false,
            matching: "lines",
            outputFormat: "line-by-line",
            highlight: true,
            colorScheme: "dark",
          });
          ui.draw();
          ui.highlightCode();
          pre.replaceWith(container);
        }
      }

      function genCommentBlock(kind, label, text, error) {
        const block = document.createElement("div");
        block.className = "comment-block " + kind + (error ? " error" : "");
        const head = document.createElement("div");
        head.className = "cb-head";
        head.textContent = label;
        const pre = document.createElement("pre");
        if (error) {
          pre.innerHTML = `${iconSvg("alert-triangle")} ${escapeHTML(error)}`;
        } else {
          pre.textContent = text || "(empty)";
        }
        block.append(head, pre);
        return block;
      }

      function buildGenCard(target) {
        const key = target.key;
        const entry = gen.notes[key] || {
          reviewed: false,
          note: "",
          model_notes: {},
        };

        const card = document.createElement("section");
        card.className = "target-card collapsed" + (entry.reviewed ? " reviewed" : "");
        card.dataset.key = key;
        gen.cardByKey[key] = card;

        const repo = repoLink(target.repo || "(no repo)", "repo");
        const commit = target.commit ? escapeHTML(target.commit) : "";
        const path = escapeHTML(target.path || "");
        const lines = escapeHTML(genLineLabel(target));
        const typeChip = target.type
          ? `<span class="gchip ${escapeHTML(target.type)}">${escapeHTML(target.type)}</span>`
          : "";
        const statusChip = target.status
          ? `<span class="gchip ${escapeHTML(target.status)}">${escapeHTML(target.status)}</span>`
          : "";
        const anchor = target.anchor
          ? `<span class="anchor-pill" title="${escapeHTML(target.anchor)}">${escapeHTML(target.anchor)}</span>`
          : "";

        // Header: click to collapse/expand. Top row is repo + path + chips;
        // the muted meta row carries commit, line range and anchor.
        const header = document.createElement("div");
        header.className = "card-header";
        header.innerHTML = `
          ${iconSvg("chevron-down", "card-toggle")}
          <div class="ch-main">
            <div class="ch-top">
              ${repo}
              <span class="path" title="${path}">${path}</span>
              <span class="ch-chips">${typeChip}${statusChip}</span>
            </div>
            <div class="ch-meta">
              ${commit ? `<span class="commit">@${commit}</span>` : ""}
              ${lines ? `<span class="lines">${lines}</span>` : ""}
              ${anchor}
            </div>
          </div>
        `;
        header.addEventListener("click", (event) => {
          // Let the repo link work without toggling the card.
          if (event.target.closest("a")) return;
          card.classList.toggle("collapsed");
        });

        const actions = document.createElement("div");
        actions.className = "ch-actions";

        // Copy a chatbot-ready markdown of the prompt + generations.
        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.className = "card-copy";
        copyButton.title = "Copy prompt + generations";
        copyButton.innerHTML = iconSvg("copy");
        copyButton.addEventListener("click", async (event) => {
          event.stopPropagation();
          try {
            await navigator.clipboard.writeText(genClipboardText(target));
            copyButton.innerHTML = iconSvg("check");
            copyButton.classList.add("copied");
            setTimeout(() => {
              copyButton.innerHTML = iconSvg("copy");
              copyButton.classList.remove("copied");
            }, 1200);
          } catch (error) {
            alert("Copy failed: " + error.message);
          }
        });
        actions.appendChild(copyButton);

        // Reviewed checkbox — toggles review state without collapsing the card.
        const reviewLabel = document.createElement("label");
        reviewLabel.className = "review-check";
        const reviewBox = document.createElement("input");
        reviewBox.type = "checkbox";
        reviewBox.checked = !!entry.reviewed;
        reviewLabel.append(reviewBox, document.createTextNode("Reviewed"));
        reviewLabel.addEventListener("click", (event) => event.stopPropagation());
        reviewBox.addEventListener("change", () => {
          noteEntry(key).reviewed = reviewBox.checked;
          card.classList.toggle("reviewed", reviewBox.checked);
          const block = gen.blockByKey[key];
          if (block) block.classList.toggle("reviewed", reviewBox.checked);
          markDirty();
          updateReviewCount();
        });
        actions.appendChild(reviewLabel);
        header.appendChild(actions);
        card.appendChild(header);

        const body = document.createElement("div");
        body.className = "card-body";
        card.appendChild(body);

        const promptLabel = document.createElement("div");
        promptLabel.className = "section-label";
        promptLabel.textContent = "Prompt";
        body.appendChild(promptLabel);

        const promptWrap = document.createElement("div");
        promptWrap.className = "prompt-wrap";
        body.appendChild(promptWrap);
        renderPrompt(promptWrap, target);

        const compareLabel = document.createElement("div");
        compareLabel.className = "section-label";
        compareLabel.innerHTML = `
          <span class="dot human"></span> Human
          <span style="opacity:0.4; padding:0 6px;">vs</span>
          <span class="dot model"></span> Models
        `;
        body.appendChild(compareLabel);

        const grid = document.createElement("div");
        grid.className = "comments-grid";
        grid.appendChild(genCommentBlock("human", "Human", target.human, null));
        for (const result of target.results || []) {
          const model = result.model || "(model)";
          const block = genCommentBlock("model", model, result.comment, result.error);
          block.appendChild(buildModelNote(key, model, entry));
          grid.appendChild(block);
        }
        body.appendChild(grid);

        // Overall note for the whole change, below the comparison grid.
        const notesLabel = document.createElement("div");
