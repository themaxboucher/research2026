        notesLabel.className = "section-label";
        notesLabel.textContent = "My notes";
        body.appendChild(notesLabel);

        const notesWrap = document.createElement("div");
        notesWrap.className = "prompt-wrap";
        const overall = document.createElement("textarea");
        overall.className = "note-input overall-note";
        overall.placeholder = "Overall notes for this change...";
        overall.value = entry.note || "";
        overall.addEventListener("input", () => {
          noteEntry(key).note = overall.value;
          markDirty();
        });
        notesWrap.appendChild(overall);
        body.appendChild(notesWrap);

        return card;
      }

      // A per-model note input, shown under that model's generated comment.
      function buildModelNote(key, model, entry) {
        const wrap = document.createElement("div");
        wrap.className = "model-note-wrap";
        const textarea = document.createElement("textarea");
        textarea.className = "note-input model-note";
        textarea.placeholder = `Note on ${model}...`;
        textarea.value = (entry.model_notes && entry.model_notes[model]) || "";
        textarea.addEventListener("input", () => {
          noteEntry(key).model_notes[model] = textarea.value;
          markDirty();
        });
        wrap.appendChild(textarea);
        return wrap;
      }

      // Build a clean, chatbot-ready markdown of the prompt + the human's
      // comment + each model's generation — nothing else (no notes, review
      // state or scoring). Comment text is fenced so its leading `#` lines
      // don't render as markdown headings when pasted.
      function genClipboardText(target) {
        const fence = (text) => "```text\n" + (text || "") + "\n```";
        const lines = ["# Code comment generation", ""];
        if (target.repo) lines.push(`**Repository:** ${target.repo}`);
        if (target.path) lines.push(`**File:** ${target.path}`);
        const loc = [
          target.type ? `${target.type} comment` : "",
          genLineLabel(target),
        ]
          .filter(Boolean)
          .join(" ");
        if (loc) lines.push(`**Target:** ${loc}`);

        lines.push("", "## Prompt given to each model", "", target.prompt || "(no prompt)");
        lines.push("", "## The developer's actual comment", "", fence(target.human || "(none)"));
        lines.push("", "## Model-generated comments");
        for (const result of target.results || []) {
          lines.push("", `### ${result.model || "(model)"}`, "");
          lines.push(
            result.error
              ? fence(`generation error: ${result.error}`)
              : fence(result.comment || "(empty)"),
          );
        }
        return lines.join("\n") + "\n";
      }

      function genHaystack(target) {
        const parts = [
          target.repo,
          target.path,
          target.human,
          target.anchor,
          target.prompt,
        ];
        for (const result of target.results || []) {
          parts.push(result.comment, result.model);
        }
        return parts.filter(Boolean).join(" ").toLowerCase();
      }

      function renderGenerations() {
        if (!gen.data) return;
        const root = document.getElementById("gen-root");
        root.innerHTML = "";
        gen.cardByKey = {};
        gen.blockByKey = {};
        const query = gen.query.trim().toLowerCase();
        const filtered = query
          ? gen.data.targets.filter((t) => genHaystack(t).includes(query))
          : gen.data.targets;

        const cards = [];
        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "gen-empty";
          empty.innerHTML = `<h2>No matches</h2><p>Try a different search term.</p>`;
          root.appendChild(empty);
        } else {
          for (const target of filtered) {
            const card = buildGenCard(target);
            cards.push(card);
            root.appendChild(card);
          }
        }
        buildGenProgress(filtered, cards);

        const repoCount = new Set(gen.data.targets.map((t) => t.repo)).size;
        const modelLabel =
          gen.data.models.length === 1
            ? gen.data.models[0]
            : `${gen.data.models.length} models`;
        document.getElementById("gen-count").textContent =
          `${filtered.length}${query ? ` of ${gen.data.targets.length}` : ""} ` +
          `target${filtered.length === 1 ? "" : "s"} · ` +
          `${repoCount} repo${repoCount === 1 ? "" : "s"} · ${modelLabel}`;
        document.getElementById("gen-source").textContent =
          gen.data.source + " · generated " + gen.data.generated_at;
      }

      // Build the right-edge reading-position rail: one block per card, each a
      // shortcut that scrolls its card into view. Hidden when there's nothing
      // to navigate (0 or 1 card).
      function buildGenProgress(targets, cards) {
        const rail = document.getElementById("gen-progress");
        rail.innerHTML = "";
        gen.cardEls = cards;
        gen.blockEls = [];
        if (cards.length <= 1) {
          rail.style.display = "none";
          return;
        }
        rail.style.display = "flex";
        targets.forEach((target, index) => {
          const block = document.createElement("button");
          block.type = "button";
          block.className = "pblock";
          const entry = gen.notes[target.key];
          if (entry && entry.reviewed) block.classList.add("reviewed");
          block.title =
            (target.repo || "") + (target.path ? " · " + target.path : "");
          block.addEventListener("click", () => {
            cards[index].scrollIntoView({ behavior: "smooth", block: "start" });
          });
          rail.appendChild(block);
          gen.blockEls.push(block);
          gen.blockByKey[target.key] = block;
        });
        updateGenProgress();
      }

      // Highlight the block for the card currently at the top of the view. The
      // "current" card is the last one whose top has scrolled past a marker
      // line just below the view's top edge.
      function updateGenProgress() {
        if (!gen.blockEls || !gen.blockEls.length) return;
        const view = document.getElementById("gen-view");
        const marker = view.getBoundingClientRect().top + 120;
        let current = 0;
        for (let i = 0; i < gen.cardEls.length; i++) {
          if (gen.cardEls[i].getBoundingClientRect().top <= marker) current = i;
          else break;
        }
        // At the very bottom, the last (possibly short) card is what's in view.
        if (view.scrollTop + view.clientHeight >= view.scrollHeight - 2) {
          current = gen.cardEls.length - 1;
        }
        gen.blockEls.forEach((block, i) =>
          block.classList.toggle("active", i === current),
        );
        // Keep the active block visible if the rail itself overflows.
        const rail = document.getElementById("gen-progress");
        const block = gen.blockEls[current];
        if (rail.scrollHeight > rail.clientHeight) {
          const top = block.offsetTop;
          const bottom = top + block.offsetHeight;
          if (top < rail.scrollTop) rail.scrollTop = top - 4;
          else if (bottom > rail.scrollTop + rail.clientHeight)
            rail.scrollTop = bottom - rail.clientHeight + 4;
        }
      }

      let genProgressRaf = null;
      document.getElementById("gen-view").addEventListener("scroll", () => {
        if (genProgressRaf) return;
        genProgressRaf = requestAnimationFrame(() => {
          genProgressRaf = null;
          updateGenProgress();
        });
      });

      for (const button of document.querySelectorAll("#view-toggle button")) {
        button.addEventListener("click", () => setView(button.dataset.view));
      }

      let genSearchTimer = null;
      document.getElementById("gen-search").addEventListener("input", (event) => {
        gen.query = event.target.value;
        clearTimeout(genSearchTimer);
        genSearchTimer = setTimeout(renderGenerations, 150);
      });

      // One Save button for all notes + review state; Cmd/Ctrl+S does the same.
      document.getElementById("gen-save").addEventListener("click", saveNotes);
      window.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveNotes();
        }
      });
      window.addEventListener("beforeunload", (event) => {
        if (gen.dirty) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      loadMeta();
    </script>
  </body>
</html>
